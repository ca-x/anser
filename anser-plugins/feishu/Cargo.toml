[package]
name = "anser-plugin-feishu"
version = "0.5.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anser-core.workspace = true
anser-plugin-api.workspace = true
anser-channel-http = { path = "../http" }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
tokio = { workspace = true, features = ["sync"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
hmac = "=0.12.1"

[dev-dependencies]
anser-channel-http = { path = "../http", features = ["test-support"] }
tokio = { workspace = true, features = ["io-util", "net"] }
