[package]
name = "anser-plugin-certificate-expiration"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anser-core.workspace = true
anser-plugin-api.workspace = true
anser-channel-http = { path = "../http" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
url = "2"
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
