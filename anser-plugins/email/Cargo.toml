[package]
name = "anser-plugin-email"
version = "0.5.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anser-core.workspace = true
anser-plugin-api.workspace = true
anser-channel-http = { path = "../http" }
serde.workspace = true
serde_json.workspace = true
lettre = { version = "=0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
url = "2"
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net"] }
