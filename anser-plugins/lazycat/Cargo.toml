[package]
name = "anser-plugin-lazycat"
version = "0.5.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
anser-core.workspace = true
anser-plugin-api.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[target.'cfg(unix)'.dependencies]
lzc-sdk = { version = "=0.2.1", default-features = false, features = ["gateway"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
url = "2"
zeroize = "1"

[target.'cfg(unix)'.dev-dependencies]
rustls.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
