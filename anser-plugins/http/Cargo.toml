[package]
name = "anser-channel-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[dependencies]
anser-core.workspace = true
anser-plugin-api.workspace = true
httpdate = "1"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form", "json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
zeroize = "1"
