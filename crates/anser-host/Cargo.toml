[package]
name = "anser-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
certificate-expiration = ["dep:anser-plugin-certificate-expiration"]
openai-tts = ["dep:anser-plugin-openai-tts"]
weather-wttr = ["dep:anser-plugin-weather-wttr"]
weather-open-meteo = ["dep:anser-plugin-weather-open-meteo"]
chanify = ["dep:anser-plugin-chanify"]
dingtalk = ["dep:anser-plugin-dingtalk"]
discord = ["dep:anser-plugin-discord"]
gotify = ["dep:anser-plugin-gotify"]
ifttt = ["dep:anser-plugin-ifttt"]
qqbot = ["dep:anser-plugin-qqbot"]
slack = ["dep:anser-plugin-slack"]
wecom = ["dep:anser-plugin-wecom"]
wechat-mp = ["dep:anser-plugin-wechat-mp"]
telegram = ["dep:anser-plugin-telegram"]
serverchan = ["dep:anser-plugin-serverchan"]
ntfy = ["dep:anser-plugin-ntfy"]
feishu = ["dep:anser-plugin-feishu"]
email = ["dep:anser-plugin-email"]
bark = ["dep:anser-plugin-bark"]
lazycat = ["dep:anser-plugin-lazycat"]

[dependencies]
anser-plugin-weather-open-meteo = { path = "../../anser-plugins/weather-open-meteo", optional = true }
anser-plugin-weather-wttr = { path = "../../anser-plugins/weather-wttr", optional = true }
anser-plugin-openai-tts = { path = "../../anser-plugins/openai-tts", optional = true }
anser-plugin-certificate-expiration = { path = "../../anser-plugins/certificate-expiration", optional = true }
anser-plugin-chanify = { path = "../../anser-plugins/chanify", optional = true }
anser-plugin-dingtalk = { path = "../../anser-plugins/dingtalk", optional = true }
anser-plugin-discord = { path = "../../anser-plugins/discord", optional = true }
anser-plugin-gotify = { path = "../../anser-plugins/gotify", optional = true }
anser-plugin-ifttt = { path = "../../anser-plugins/ifttt", optional = true }
anser-plugin-qqbot = { path = "../../anser-plugins/qqbot", optional = true }
anser-plugin-slack = { path = "../../anser-plugins/slack", optional = true }
anser-plugin-wecom = { path = "../../anser-plugins/wecom", optional = true }
anser-plugin-wechat-mp = { path = "../../anser-plugins/wechat-mp", optional = true }
anser-plugin-telegram = { path = "../../anser-plugins/telegram", optional = true }
anser-plugin-serverchan = { path = "../../anser-plugins/serverchan", optional = true }
anser-plugin-ntfy = { path = "../../anser-plugins/ntfy", optional = true }
anser-plugin-feishu = { path = "../../anser-plugins/feishu", optional = true }
anser-plugin-email = { path = "../../anser-plugins/email", optional = true }
anser-plugin-bark = { path = "../../anser-plugins/bark", optional = true }
anser-core.workspace = true
anser-plugin-api.workspace = true
rutis.workspace = true
rutis-bridge.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(unix)'.dependencies]
anser-plugin-lazycat = { workspace = true, optional = true }
