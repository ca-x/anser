[package]
name = "anser-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "anser"
path = "src/main.rs"

[features]
certificate-expiration = ["anser-host/certificate-expiration"]
openai-tts = ["anser-host/openai-tts"]
weather-wttr = ["anser-host/weather-wttr"]
weather-open-meteo = ["anser-host/weather-open-meteo"]
chanify = ["anser-host/chanify"]
dingtalk = ["anser-host/dingtalk"]
discord = ["anser-host/discord"]
gotify = ["anser-host/gotify"]
ifttt = ["anser-host/ifttt"]
qqbot = ["anser-host/qqbot"]
slack = ["anser-host/slack"]
wecom = ["anser-host/wecom"]
wechat-mp = ["anser-host/wechat-mp"]
telegram = ["anser-host/telegram"]
serverchan = ["anser-host/serverchan"]
ntfy = ["anser-host/ntfy"]
feishu = ["anser-host/feishu"]
email = ["anser-host/email"]
bark = ["anser-host/bark"]
default = ["bark", "certificate-expiration", "openai-tts", "chanify", "dingtalk", "discord", "email", "feishu", "gotify", "ifttt", "lazycat", "ntfy", "qqbot", "serverchan", "slack", "telegram", "weather-open-meteo", "weather-wttr", "wechat-mp", "wecom"]
lazycat = ["anser-host/lazycat"]

[dependencies]
anser-mcd = { path = "../anser-mcd" }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
anser-channel-http = { path = "../../anser-plugins/http" }
argon2 = "0.5"
reqwest.workspace = true
rustls.workspace = true
anser-plugin-api.workspace = true
anser-queue = { path = "../anser-queue" }
anyhow.workspace = true
base64.workspace = true
futures-util = "0.3"
data-encoding = "2.11"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
hmac = { version = "0.13", features = ["zeroize"] }
rand.workspace = true
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha2 = "0.10"
subtle = "2"
serde.workspace = true
semver = "1"
tempfile = "3"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"] }
zeroize = "1"
anser-core.workspace = true
anser-host.workspace = true
anser-store.workspace = true
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "net", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
