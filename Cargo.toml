[workspace]
members = ["crates/*", "anser-plugins/*"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/ca-x/anser"

[workspace.dependencies]
anser-core = { path = "crates/anser-core" }
anser-host = { path = "crates/anser-host", default-features = false }
anser-plugin-api = { path = "crates/anser-plugin-api" }
anser-plugin-lazycat = { path = "anser-plugins/lazycat" }
anser-store = { path = "crates/anser-store" }
rutis = "=0.23.0"
rutis-bridge = { version = "=0.23.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
base64 = "0.22"
rand = "0.8.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
