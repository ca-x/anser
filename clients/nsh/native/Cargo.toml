[package]
name = "anser-client-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.0"
nsh-omarchy = { version = "=0.1.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
futures-channel = "0.3"
gio = "0.22"
gstreamer = "0.25"
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "mp3"] }
