name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANSER_REQUIRE_WEB: "1"
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm --prefix clients/web ci
      - run: npm --prefix clients/web test
      - run: npm --prefix clients/web run build
      - name: Test the route editor in Chrome
        run: CHROME_BIN="$(command -v google-chrome)" npm --prefix clients/web run test:browser
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo check --locked -p anser-server --no-default-features

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Check dependencies with cargo-deny
        run: |
          set -euo pipefail
          version=0.22.0
          archive="cargo-deny-$version-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/${archive}"
          curl --fail --silent --show-error --location --remote-name "$url"
          echo "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786  $archive" | sha256sum --check -
          tar -xzf "$archive"
          "./${archive%.tar.gz}/cargo-deny" --locked check

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: anser:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root startup and health
        run: |
          set -euo pipefail
          docker run --detach --name anser-ci --publish 127.0.0.1::8080 anser:ci
          cleanup() {
            if [[ $? -ne 0 ]]; then
              docker logs anser-ci || true
            fi
            docker rm --force anser-ci >/dev/null
          }
          trap cleanup EXIT
          test "$(docker inspect --format '{{.Config.User}}' anser-ci)" = "10001:10001"
          port="$(docker port anser-ci 8080/tcp | sed -n 's/^127\.0\.0\.1://p')"
          test -n "$port"
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 3 "http://127.0.0.1:$port/healthz"
          curl --silent --show-error --fail --max-time 3 "http://127.0.0.1:$port/login" | grep -F '/assets/anser/'
