name: NSH client

on:
  pull_request:
    paths: ["clients/nsh/**", ".github/workflows/client.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
      # The first NSH release with nshm support is still pending.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: longbridge/nsh
          ref: 21080f1cccc081d28c509817d6f95c5e06419251
          path: .nsh-upstream
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
          echo 'RUSTUP_TOOLCHAIN=1.100.0' >> "$GITHUB_ENV"
      - name: Build pinned NSH and install TypeScript
        run: |
          set -euo pipefail
          (
            cd "$GITHUB_WORKSPACE/.nsh-upstream"
            cargo build --locked --target-dir target -p nsh-cli
          )
          echo "$GITHUB_WORKSPACE/.nsh-upstream/target/debug" >> "$GITHUB_PATH"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/nsh-ts" typescript@5.9.3 playwright-core@1.65.1
      - name: Verify and package
        run: |
          set -euo pipefail
          nsh check clients/nsh --tsc "$RUNNER_TEMP/nsh-ts/node_modules/.bin/tsc"
          nsh test clients/nsh
          nsh package clients/nsh --target linux --out "$RUNNER_TEMP/client-linux"
          nsh package clients/nsh --target web --out "$RUNNER_TEMP/client-web"
          mkdir -p client-dist
          mapfile -t linux < <(find "$RUNNER_TEMP/client-linux" -type f -name '*.tar.gz')
          test "${#linux[@]}" -eq 1
          cp "${linux[0]}" client-dist/anser-client-linux-x86_64.tar.gz
          mapfile -t web < <(find "$RUNNER_TEMP/client-web" -type f -name index.html)
          test "${#web[@]}" -eq 1
          web_dir=$(dirname "${web[0]}")
          python -m http.server 17474 --bind 127.0.0.1 --directory "$web_dir" &
          server=$!
          trap 'kill "$server"' EXIT
          url=http://127.0.0.1:17474/
          curl --fail --retry 4 --retry-connrefused --silent --show-error "$url" -o /dev/null
          node clients/nsh/tests/web-package.mjs "$RUNNER_TEMP/nsh-ts/node_modules/playwright-core/index.mjs" "$url"
          tar -C "$web_dir" -czf client-dist/anser-client-web.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anser-native-client
          path: client-dist/*.tar.gz
          if-no-files-found: error
