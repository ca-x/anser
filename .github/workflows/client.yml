name: NSH client

on:
  pull_request:
    paths: ["clients/nsh/**", ".github/workflows/client.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
      - name: Install pinned NSH and TypeScript
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/nsh-tools"
          mkdir -p "$tools"
          cd "$tools"
          release=https://github.com/longbridge/nsh/releases/download/v0.6.1
          curl --fail --silent --show-error --location --retry 3 --remote-name "$release/nsh-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --remote-name "$release/nsh-web.tar.gz"
          sha256sum --check <<'CHECKSUMS'
          9a7ac692f1c229df476be8ff83a3c5912d271453b644e313f02cb19d18696070  nsh-linux-x86_64.tar.gz
          e509e35fbad261a4a5e27a9225c364ff0d9ddd202a638b02bbfd13fb5cd1b9f1  nsh-web.tar.gz
          CHECKSUMS
          tar -xzf nsh-linux-x86_64.tar.gz
          tar -xzf nsh-web.tar.gz
          echo "$tools/nsh/bin" >> "$GITHUB_PATH"
          echo "NSH_RUNTIME=$tools/nsh/runtime" >> "$GITHUB_ENV"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/nsh-ts" typescript@5.9.3
      - name: Verify and package
        run: |
          set -euo pipefail
          nsh check clients/nsh --tsc "$RUNNER_TEMP/nsh-ts/node_modules/.bin/tsc"
          nsh test clients/nsh
          nsh package clients/nsh --target linux --out "$RUNNER_TEMP/client-linux"
          nsh package clients/nsh --target web --out "$RUNNER_TEMP/client-web"
          mkdir -p client-dist
          mapfile -t linux < <(find "$RUNNER_TEMP/client-linux" -type f -name '*.tar.gz')
          test "${#linux[@]}" -eq 1
          cp "${linux[0]}" client-dist/anser-client-linux-x86_64.tar.gz
          mapfile -t web < <(find "$RUNNER_TEMP/client-web" -type f -name index.html)
          test "${#web[@]}" -eq 1
          tar -C "$(dirname "${web[0]}")" -czf client-dist/anser-client-web.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anser-native-client
          path: client-dist/*.tar.gz
          if-no-files-found: error
