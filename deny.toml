[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "lzc-sdk only signs the fixed application identity locally during token refresh. Anser provides no RSA decryption or arbitrary signing endpoint." },
    { id = "RUSTSEC-2025-0134", reason = "lzc-sdk 0.2.0 uses rustls-pemfile to parse platform-mounted certificates. Replacement depends on the SDK." },
    { id = "RUSTSEC-2026-0543", reason = "rmcp 3.11.0 requires chrono for protocol timestamps. This is an unmaintained dependency notice; application time calculations use Jiff." },
]

[licenses]
allow = [
    "0BSD",
    "CDLA-Permissive-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
deny = [
    { name = "native-tls" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
